name: Refresh GameMonetize catalogue

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gamemonetize-catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh current official feed
        env:
          GR8_GAMEMONETIZE_REFRESH: 'true'
        run: pnpm run ingest:gamemonetize
      - run: pnpm run validate:gamemonetize
      - run: pnpm run validate:partners
      - name: Open a draft catalogue update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/partnerCatalog.generated.json src/data/providers/gamemonetize reports/partner-catalogue-report.json reports/gamemonetize-ingestion-report.json; then
            echo "No material catalogue changes."
            exit 0
          fi
          branch="automation/gamemonetize-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/partnerCatalog.generated.json src/data/providers/gamemonetize reports/partner-catalogue-report.json reports/gamemonetize-ingestion-report.json
          git commit -m "Refresh GameMonetize catalogue"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" --title "Refresh GameMonetize catalogue" --body "Automated daily refresh from the current official publisher feed. Review validation totals and provider availability before merging."
